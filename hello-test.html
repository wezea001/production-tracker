<title>Hello Link Test</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root {
    --bg: #f2f5f3;
    --surface: #ffffff;
    --text: #171b1a;
    --text-muted: #5b645f;
    --accent: #2f6f5e;
    --accent-soft: #e4efe9;
    --border: #dde2e0;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12161a;
      --surface: #1a2024;
      --text: #e8ece9;
      --text-muted: #9aa6a0;
      --accent: #6cc4a7;
      --accent-soft: #1f2c28;
      --border: #2a3236;
    }
  }

  :root[data-theme="dark"] {
    --bg: #12161a;
    --surface: #1a2024;
    --text: #e8ece9;
    --text-muted: #9aa6a0;
    --accent: #6cc4a7;
    --accent-soft: #1f2c28;
    --border: #2a3236;
  }

  * { box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif;
    padding: 24px;
  }

  .card {
    width: 100%;
    max-width: 420px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 44px 40px 36px;
    display: flex;
    flex-direction: column;
    gap: 22px;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
  }

  .status {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    align-self: flex-start;
    padding: 5px 12px 5px 10px;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent);
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: 12px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .status .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
  }

  h1 {
    font-family: 'Fraunces', ui-serif, Georgia, serif;
    font-weight: 600;
    font-size: 56px;
    line-height: 1;
    margin: 0;
    text-wrap: balance;
  }

  p.lede {
    margin: 0;
    color: var(--text-muted);
    font-size: 15px;
    line-height: 1.5;
    max-width: 32ch;
  }

  dl.receipt {
    margin: 4px 0 0;
    padding-top: 18px;
    border-top: 1px solid var(--border);
    display: grid;
    grid-template-columns: auto 1fr;
    column-gap: 16px;
    row-gap: 8px;
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: 12.5px;
  }

  dl.receipt dt {
    color: var(--text-muted);
  }

  dl.receipt dd {
    margin: 0;
    text-align: right;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
</style>

<div class="card">
  <span class="status"><span class="dot"></span>Link is working</span>
  <div>
    <h1>Hello.</h1>
    <p class="lede">This page exists to confirm a shared link opens correctly &mdash; nothing more to see here.</p>
  </div>
  <dl class="receipt">
    <dt>Opened</dt>
    <dd id="opened-at">&mdash;</dd>
    <dt>Browser</dt>
    <dd id="browser">&mdash;</dd>
  </dl>
</div>

<script>
  document.getElementById('opened-at').textContent = new Date().toLocaleString(undefined, {
    dateStyle: 'medium',
    timeStyle: 'short'
  });

  (function () {
    var ua = navigator.userAgent;
    var name = 'Unknown';
    if (/Edg\//.test(ua)) name = 'Edge';
    else if (/Chrome\//.test(ua) && !/Chromium/.test(ua)) name = 'Chrome';
    else if (/Firefox\//.test(ua)) name = 'Firefox';
    else if (/Safari\//.test(ua) && !/Chrome/.test(ua)) name = 'Safari';
    document.getElementById('browser').textContent = name;
  })();
</script>
