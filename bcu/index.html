<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brand Commercialization Updates Creative Deliverables Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--navy-950:#170B39;--navy-800:#2A1856;--g1:#A5E6FF;--g2:#7F4FFF;--g3:#E91DF9;--g4:#FF3B89;--g5:#FFD24A;--crit:#FF7FAE;}
  *{box-sizing:border-box;} html,body{margin:0;padding:0;min-height:100%;}
  body{background:radial-gradient(1200px 600px at 50% -10%, #3a2380 0%, var(--navy-950) 55%); color:#F3F1E8; font-family:"Archivo",ui-sans-serif,system-ui,sans-serif; display:flex; align-items:center; justify-content:center; min-height:100vh; padding:24px; -webkit-font-smoothing:antialiased;}
  .card{width:100%; max-width:420px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.14); border-radius:16px; padding:34px 30px 28px; box-shadow:0 30px 80px -30px rgba(0,0,0,.7); text-align:center;}
  .logo{height:64px; width:auto; margin:0 auto 18px; display:block;}
  .eyebrow{display:inline-flex; align-items:center; gap:8px; text-transform:uppercase; letter-spacing:.14em; font-size:10.5px; font-weight:700; color:#FBF7EC; padding:5px 12px 5px 10px; border-radius:99px; background-image:linear-gradient(rgba(255,255,255,.09),rgba(255,255,255,.09)),linear-gradient(100deg,var(--g1) 0%,var(--g2) 32%,var(--g3) 58%,var(--g4) 78%,var(--g5) 100%); background-origin:border-box; background-clip:padding-box,border-box; border:1px solid transparent;}
  .eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--g5);}
  h1{font-family:"Poppins",sans-serif; font-weight:700; font-size:19px; line-height:1.25; margin:16px 0 6px; color:#FBFAF5;}
  h1 span{background:linear-gradient(100deg,var(--g1) 0%,var(--g2) 32%,var(--g3) 58%,var(--g4) 78%,var(--g5) 100%); -webkit-background-clip:text; background-clip:text; color:transparent;}
  p.sub{color:#C7BEE3; font-size:13.5px; margin:0 0 22px; line-height:1.5;}
  form{display:flex; flex-direction:column; gap:12px; text-align:left;}
  label{font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:#C7BEE3; font-weight:600;}
  input[type=password]{font:inherit; font-size:16px; padding:11px 13px; border-radius:10px; border:1px solid rgba(255,255,255,.22); background:rgba(255,255,255,.08); color:#fff; width:100%; outline:none;}
  input[type=password]:focus{border-color:var(--g2); box-shadow:0 0 0 3px rgba(127,79,255,.3);}
  button{font:inherit; font-weight:600; font-size:14px; padding:11px 16px; border-radius:10px; border:none; cursor:pointer; color:#fff; background:linear-gradient(100deg,var(--g2),var(--g3)); margin-top:4px;}
  button:disabled{opacity:.6; cursor:progress;}
  .remember{display:flex; align-items:center; gap:8px; font-size:12.5px; color:#C7BEE3; text-transform:none; letter-spacing:0;}
  .remember input{width:15px;height:15px;margin:0;accent-color:var(--g2);}
  .err{display:none; color:var(--crit); font-size:13px; margin-top:4px;}
  .err.show{display:block;}
  .foot{margin-top:20px; font-size:11.5px; color:#8F84B8;}
</style>
</head>

<script>
(function(){
  const P = JSON.parse(document.getElementById('vault').textContent);
  const REMEMBER_KEY = 'bcu-tracker-unlock-v1';
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const enc = new TextEncoder();
  async function deriveKM(password){
    const base = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits({ name:'PBKDF2', hash:'SHA-256', salt:b64(P.salt), iterations:P.iter }, base, 512);
    return new Uint8Array(bits);
  }
  async function decryptWith(km){
    const macKey = await crypto.subtle.importKey('raw', km.slice(32), { name:'HMAC', hash:'SHA-256' }, false, ['verify']);
    const iv = b64(P.iv), ct = b64(P.ct);
    const data = new Uint8Array(iv.length + ct.length); data.set(iv); data.set(ct, iv.length);
    const ok = await crypto.subtle.verify('HMAC', macKey, b64(P.mac), data);
    if(!ok) return null;
    const encKey = await crypto.subtle.importKey('raw', km.slice(0,32), { name:'AES-CBC' }, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({ name:'AES-CBC', iv }, encKey, ct);
    return new TextDecoder().decode(plain);
  }
  function show(html){ document.open(); document.write(html); document.close(); }
  async function tryRemembered(){
    try{
      const saved = localStorage.getItem(REMEMBER_KEY);
      if(!saved) return;
      const km = b64(saved);
      if(km.length !== 64) return;
      const html = await decryptWith(km);
      if(html) show(html); else localStorage.removeItem(REMEMBER_KEY);
    }catch(e){}
  }
  document.getElementById('gate').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const btn = document.getElementById('go'); const err = document.getElementById('err');
    const remember = document.getElementById('remember').checked;
    btn.disabled = true; btn.textContent = 'Unlocking…'; err.classList.remove('show');
    try{
      const km = await deriveKM(document.getElementById('pw').value);
      const html = await decryptWith(km);
      if(!html){ err.classList.add('show'); btn.disabled=false; btn.textContent='Open tracker'; return; }
      try{ if(remember) localStorage.setItem(REMEMBER_KEY, btoa(String.fromCharCode.apply(null, km))); else localStorage.removeItem(REMEMBER_KEY); }catch(e){}
      show(html);
    }catch(e){ err.classList.add('show'); btn.disabled=false; btn.textContent='Open tracker'; }
  });
  // Only replace the document once it has fully loaded; document.write during parsing would append instead.
  let hasSaved = false; try{ hasSaved = !!localStorage.getItem(REMEMBER_KEY); }catch(e){}
  const card = document.querySelector('.card');
  if(hasSaved && card) card.style.visibility = 'hidden';
  window.addEventListener('load', ()=>{ setTimeout(async ()=>{ await tryRemembered(); if(card) card.style.visibility = ''; }, 0); });
})();
</script>
