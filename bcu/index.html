<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brand Commercialization Updates Creative Deliverables Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style id="app-style">
  :root{
    /* DCP Brand Guidelines v2.0: Cetacean Blue family + signature gradient */
    --navy-950:#170B39; --navy-800:#2A1856; --navy-700:#4B2D9C;
    --ink:#170B39; --ink-soft:#5B5570;
    --paper:#FFFFFF; --surface:#FFFFFF; --surface-2:#F6F3FB;
    --line:#E4E1EE; --line-strong:#D3CEE3;
    --gold:#B8860B; --gold-soft:#FFF3D6;
    --ok:#1E9E6B; --ok-soft:#E3F7EE;
    --prog:#643ECE; --prog-soft:#EFE9FB;
    --warn:#A66A00; --warn-soft:#FFF3D6;
    --crit:#C81466; --crit-soft:#FFE1EC;
    --neutral-soft:#EFEDF5;
    --accent:#7F4FFF; --accent-soft:#EFE9FB;
    --g1:#A5E6FF; --g2:#7F4FFF; --g3:#E91DF9; --g4:#FF3B89; --g5:#FFD24A;
    --brand-gradient: linear-gradient(100deg, var(--g1) 0%, var(--g2) 32%, var(--g3) 58%, var(--g4) 78%, var(--g5) 100%);
    --shadow: 0 1px 2px rgba(23,11,57,.06), 0 6px 20px -8px rgba(23,11,57,.14);
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --navy-950:#0F0826; --navy-800:#1F1247; --navy-700:#4B2D9C;
      --ink:#F1EDFA; --ink-soft:#B9AFDA;
      --paper:#130A2E; --surface:#1B1040; --surface-2:#22134D;
      --line:#3A2A66; --line-strong:#4B3785;
      --gold:#FFD24A; --gold-soft:#3A2E12;
      --ok:#5FD9A4; --ok-soft:#123326;
      --prog:#A78BFF; --prog-soft:#241857;
      --warn:#FFCB66; --warn-soft:#332510;
      --crit:#FF7FAE; --crit-soft:#3A1330;
      --neutral-soft:#241857;
      --accent:#A78BFF; --accent-soft:#241857;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px -10px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --navy-950:#0F0826; --navy-800:#1F1247; --navy-700:#4B2D9C;
    --ink:#F1EDFA; --ink-soft:#B9AFDA;
    --paper:#130A2E; --surface:#1B1040; --surface-2:#22134D;
    --line:#3A2A66; --line-strong:#4B3785;
    --gold:#FFD24A; --gold-soft:#3A2E12;
    --ok:#5FD9A4; --ok-soft:#123326;
    --prog:#A78BFF; --prog-soft:#241857;
    --warn:#FFCB66; --warn-soft:#332510;
    --crit:#FF7FAE; --crit-soft:#3A1330;
    --neutral-soft:#241857;
    --accent:#A78BFF; --accent-soft:#241857;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px -10px rgba(0,0,0,.6);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper); color:var(--ink);
    font-family:"Archivo", ui-sans-serif, system-ui, -apple-system, sans-serif;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:"Poppins", ui-sans-serif, system-ui, sans-serif; font-weight:600; text-wrap:balance; margin:0;}
  .mono{font-family:"IBM Plex Mono", ui-monospace, monospace; font-variant-numeric:tabular-nums;}
  a{color:inherit;}
  button{font:inherit;}
  ::selection{background:var(--gold-soft);}

  .wrap{max-width:1180px; margin:0 auto; padding:0 24px 80px;}

  /* ---------- Header ---------- */
  header.top{
    background: var(--navy-950);
    color:#F3F1E8; padding:40px 0 32px; position:relative; overflow:hidden;
  }
  header.top::before{
    content:""; position:absolute; top:0; left:0; right:0; height:6px;
    background: var(--brand-gradient); z-index:2;
  }
  header.top::after{
    content:""; position:absolute; inset:0;
    background:
      radial-gradient(46% 80% at 98% -18%, rgba(233,29,249,.38), transparent 62%),
      radial-gradient(52% 85% at 108% 22%, rgba(255,59,137,.28), transparent 58%),
      radial-gradient(42% 75% at -4% 116%, rgba(127,79,255,.36), transparent 60%),
      radial-gradient(30% 55% at 22% -25%, rgba(165,230,255,.22), transparent 60%),
      repeating-linear-gradient(115deg, rgba(255,255,255,.05) 0px, rgba(255,255,255,.05) 1px, transparent 1px, transparent 58px);
    pointer-events:none;
  }
  header.top .wrap{position:relative; z-index:1; text-align:center;}
  .header-logo{ height:100px; width:auto; display:block; margin:0 auto 26px; position:relative; }
  .eyebrow{
    display:inline-flex; align-items:center; gap:8px;
    text-transform:uppercase; letter-spacing:.14em; font-size:11px; font-weight:700;
    color:#FBF7EC; padding:6px 14px 6px 11px; border-radius:99px;
    background-image: linear-gradient(rgba(255,255,255,.09), rgba(255,255,255,.09)), var(--brand-gradient);
    background-origin: border-box; background-clip: padding-box, border-box;
    border:1px solid transparent;
  }
  .eyebrow .dot{width:6px; height:6px; border-radius:50%; background:var(--g5); flex-shrink:0;}
  .top h1{font-size:clamp(26px,3.4vw,38px); color:#FBFAF5; margin-top:16px; font-weight:700;}
  .top h1 .grad-text{
    background:var(--brand-gradient); -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .top .sub{color:#D9D2EE; font-size:14.5px; margin-top:10px; max-width:70ch;}
  .event-meta{
    color:#D9D2EE; font-size:15.5px; font-weight:500; margin-top:16px; letter-spacing:.01em;
  }
  .event-meta .sep{margin:0 10px; color:#8F84B8;}
  .box-link{
    display:inline-flex; align-items:center; gap:7px; margin-top:18px; font-size:12.5px; font-weight:600;
    color:#FBF7EC; padding:8px 18px; border-radius:99px; text-decoration:none;
    background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.22);
    transition:background .15s ease;
  }
  .box-link:hover{background:rgba(255,255,255,.16);}
  .box-link svg{flex-shrink:0;}
  .top-meta{
    display:flex; flex-wrap:wrap; gap:10px 26px; margin-top:22px; font-size:12.5px; color:#C7BEE3;
  }
  .top-meta b{color:#F5F2FC; font-weight:600;}

  .sync-pill{
    display:inline-flex; align-items:center; gap:7px; font-size:12px; font-weight:500;
    padding:5px 12px; border-radius:99px; background:rgba(255,255,255,.08); color:#EDE9F7;
    border:1px solid rgba(255,255,255,.16);
  }
  .sync-pill .dot{width:7px;height:7px;border-radius:50%;background:#5FD9A4;}
  .sync-pill.warn .dot{background:var(--g5);}

  /* ---------- Sticky control bar ---------- */
  .controlbar{
    position:sticky; top:0; z-index:40; background:var(--surface);
    border-bottom:1px solid var(--line); box-shadow:var(--shadow);
  }
  .controlbar-inner{
    max-width:1180px; margin:0 auto; padding:12px 24px;
    display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  }
  .progress-ring-wrap{display:flex; align-items:center; gap:10px; flex-shrink:0;}
  .progress-track{width:150px; height:8px; border-radius:99px; background:var(--neutral-soft); overflow:hidden;}
  .progress-fill{height:100%; background:linear-gradient(90deg, var(--accent), var(--ok)); border-radius:99px; transition:width .3s ease;}
  .progress-num{font-family:"IBM Plex Mono",monospace; font-weight:500; font-size:13px; color:var(--ink);}
  .progress-num small{color:var(--ink-soft); font-weight:400;}

  .search-box{
    flex:1 1 220px; min-width:180px; display:flex; align-items:center; gap:8px;
    border:1px solid var(--line-strong); border-radius:8px; padding:7px 12px; background:var(--surface-2);
  }
  .search-box input{
    border:none; outline:none; background:transparent; color:var(--ink); font-size:13.5px; width:100%;
  }
  .search-box svg{flex-shrink:0; opacity:.55;}

  .chip-row{display:flex; gap:6px; flex-wrap:wrap;}
  .chip{
    border:1px solid var(--line-strong); background:var(--surface); color:var(--ink-soft);
    padding:6px 12px; border-radius:99px; font-size:12.5px; cursor:pointer; font-weight:500;
    transition:all .15s ease; white-space:nowrap;
  }
  .chip:hover{border-color:var(--accent);}
  .chip.active{background:var(--navy-800); color:#F3F1E8; border-color:var(--navy-800);}
  .chip.active.flagged{background:var(--crit); border-color:var(--crit); color:#fff;}

  .expand-btns{display:flex; gap:8px; flex-shrink:0;}
  .ghost-btn{
    border:1px solid var(--line-strong); background:transparent; color:var(--ink-soft);
    padding:6px 12px; border-radius:8px; font-size:12.5px; cursor:pointer; font-weight:500;
  }
  .ghost-btn:hover{border-color:var(--accent); color:var(--ink);}

  /* ---------- Section headings ---------- */
  .section-title{
    display:flex; align-items:baseline; gap:12px; margin:56px 0 6px;
  }
  .section-title h2{font-size:23px; font-weight:600;}
  .section-title .count{font-size:13px; color:var(--ink-soft); font-family:"IBM Plex Mono",monospace;}
  .section-lede{color:var(--ink-soft); font-size:14px; max-width:74ch; margin-bottom:20px;}


  /* ---------- Flags panel ---------- */
  .flags-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr)); gap:8px; margin-bottom:8px;
  }
  .flag-card{
    display:flex; flex-direction:column; gap:4px; background:var(--surface); border:1px solid var(--line);
    border-left:4px solid var(--crit); border-radius:8px; padding:9px 12px;
    width:100%; text-align:left; font:inherit;
    color:inherit; cursor:pointer; transition:transform .12s ease, box-shadow .12s ease;
  }
  .flag-card:hover{transform:translateY(-1px); box-shadow:0 6px 18px -8px rgba(23,11,57,.24);}
  .flag-card.sev-high{border-left-color:var(--warn);}
  .flag-card.sev-medium{border-left-color:var(--gold);}
  .flag-sev{
    align-self:flex-start; flex-shrink:0; font-size:9.5px; text-transform:uppercase; letter-spacing:.06em; font-weight:700;
    padding:2px 7px; border-radius:99px; white-space:nowrap;
    background:var(--crit-soft); color:var(--crit);
  }
  .flag-card.sev-high .flag-sev{background:var(--warn-soft); color:var(--warn);}
  .flag-card.sev-medium .flag-sev{background:var(--gold-soft); color:var(--gold);}
  .flag-body{text-align:left;}
  .flag-body h3{font-size:13px; font-weight:600; margin-bottom:2px; line-height:1.3;}
  .flag-body p{font-size:11.5px; color:var(--ink-soft); margin:0; line-height:1.4;}

  .risk-pill{
    display:inline-block; font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:99px;
    text-transform:uppercase; letter-spacing:.04em; white-space:nowrap;
    background:var(--crit-soft); color:var(--crit);
  }
  .risk-pill.sev-high{background:var(--warn-soft); color:var(--warn);}
  .risk-pill.sev-medium{background:var(--gold-soft); color:var(--gold);}

  /* ---------- Accordion sections ---------- */
  details.section{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    margin-bottom:10px; box-shadow:var(--shadow); overflow:hidden;
  }
  details.section > summary{
    list-style:none; cursor:pointer; padding:15px 18px; display:flex; align-items:center; gap:14px;
  }
  details.section > summary::-webkit-details-marker{display:none;}
  .sum-caret{
    width:18px; height:18px; flex-shrink:0; transition:transform .18s ease; color:var(--ink-soft);
  }
  details[open] > summary .sum-caret{transform:rotate(90deg);}
  .sum-title{font-weight:600; font-size:15px; flex:1;}
  .sum-title .part-tag{
    font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; font-weight:700;
    color:var(--accent); margin-right:9px;
  }
  .sum-title .location-tag{
    font-size:10.5px; font-weight:700; color:var(--ink-soft); background:var(--neutral-soft);
    padding:2px 9px; border-radius:99px; margin-left:9px; white-space:nowrap;
  }
  .sum-progress{display:flex; align-items:center; gap:8px; flex-shrink:0;}
  .sum-track{width:74px; height:6px; border-radius:99px; background:var(--neutral-soft); overflow:hidden;}
  .sum-fill{height:100%; background:var(--ok); border-radius:99px;}
  .sum-count{font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--ink-soft); min-width:44px; text-align:right;}
  .sum-flagcount{
    font-size:11px; font-weight:700; color:var(--crit); background:var(--crit-soft);
    padding:2px 8px; border-radius:99px;
  }

  .item-list{border-top:1px solid var(--line);}
  .item-row{
    display:grid; grid-template-columns:1.4fr 0.75fr 0.55fr 0.55fr 0.95fr 0.85fr; gap:14px; align-items:start;
    padding:14px 18px; border-top:1px solid var(--line);
  }
  .item-row:first-child{border-top:none;}
  .item-row.is-done{background:var(--surface-2);}
  .item-row.hidden-row{display:none;}
  @media (max-width:760px){.item-row{grid-template-columns:1fr;}}

  .item-check{
    appearance:none; width:19px; height:19px; border-radius:5px; border:1.6px solid var(--line-strong);
    background:var(--surface); cursor:pointer; margin-top:2px; position:relative; flex-shrink:0;
    transition:all .12s ease;
  }
  .item-check:hover{border-color:var(--accent);}
  .item-check:checked{background:var(--ok); border-color:var(--ok);}
  .item-check:checked::after{
    content:""; position:absolute; left:5px; top:1px; width:5px; height:9px;
    border:solid white; border-width:0 2px 2px 0; transform:rotate(45deg);
  }
  .item-check:focus-visible{outline:2px solid var(--prog); outline-offset:2px;}

  .item-name{font-weight:600; font-size:14px; line-height:1.4;}
  .item-row.is-done .item-name{color:var(--ink-soft); text-decoration:line-through; text-decoration-color:var(--line-strong);}
  .item-specs{font-size:12.5px; color:var(--ink-soft); margin-top:3px;}
  .item-notes{font-size:12.5px; color:var(--ink-soft); margin-top:6px; line-height:1.5;}
  .artist-list{list-style:disc; margin:6px 0 0 18px; padding:0; font-size:12.5px; color:var(--ink-soft); line-height:1.55;}
  .artist-list li{margin-bottom:1px;}
  .col-owner, .col-fp, .col-fd, .col-dims{font-size:13px; color:var(--ink);}
  .col-owner .lbl, .col-fp .lbl, .col-fd .lbl, .col-dims .lbl, .col-status .lbl{
    display:block; font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft);
    font-weight:600; margin-bottom:2px;
  }
  .col-fp .due-val, .col-fd .due-val{font-family:"IBM Plex Mono",monospace; font-size:12.5px; color:var(--ink);}
  .col-fd .lbl{color:var(--navy-700);}
  .col-fd .due-val{font-weight:600;}
  .col-dims{font-size:12px; line-height:1.4;}
  .dim-empty{color:var(--ink-soft); font-style:italic;}

  .status-pill{
    display:inline-block; font-size:11px; font-weight:600; padding:3px 9px; border-radius:99px; white-space:nowrap;
  }
  .status-Complete{background:var(--ok-soft); color:var(--ok);}
  .status-InProgress{background:var(--prog-soft); color:var(--prog);}
  .status-NotStarted{background:var(--warn-soft); color:var(--warn);}
  .status-Other{background:var(--neutral-soft); color:var(--ink-soft);}

  .status-select{
    display:inline-block; font-family:inherit; font-size:11.5px; font-weight:600;
    padding:4px 10px; border-radius:99px; border:1px solid var(--line-strong);
    background:var(--surface-2); color:var(--ink); cursor:pointer; max-width:100%;
  }
  .status-select:focus-visible{outline:2px solid var(--prog); outline-offset:2px;}
  .status-select.st-complete{background:var(--ok-soft); color:var(--ok); border-color:transparent;}
  .status-select.st-inprogress{background:var(--prog-soft); color:var(--prog); border-color:transparent;}
  .status-select.st-notstarted{background:var(--warn-soft); color:var(--warn); border-color:transparent;}

  .readonly-banner{
    display:none; background:var(--warn-soft); color:var(--warn); border:1px solid var(--warn);
    border-radius:8px; padding:9px 14px; font-size:12.5px; margin:14px 0; font-weight:500;
  }
  .readonly-banner.show{display:block;}

  footer{
    margin-top:60px; padding-top:22px; border-top:1px solid var(--line);
    font-size:12px; color:var(--ink-soft); display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px;
  }

  .empty-state{padding:30px; text-align:center; color:var(--ink-soft); font-size:13.5px;}

  /* ---------- View tabs ---------- */
  .view-tabs{display:flex; gap:4px; background:var(--neutral-soft); padding:3px; border-radius:10px; flex-shrink:0;}
  .view-tab{border:none; background:transparent; color:var(--ink-soft); padding:7px 14px; border-radius:8px; font-size:12.5px; font-weight:600; cursor:pointer;}
  .view-tab:hover{color:var(--ink);}
  .view-tab.active{background:var(--surface); color:var(--navy-800); box-shadow:var(--shadow);}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .view-tab.active{color:#EDEAE0;}}
  :root[data-theme="dark"] .view-tab.active{color:#EDEAE0;}
  .view-panel{display:none;}
  .view-panel.active{display:block;}

  /* ---------- Chronological view ---------- */
  .week-header{display:flex; align-items:baseline; gap:10px; margin:34px 0 10px;}
  .week-header h3{font-size:15px; font-weight:600; font-family:"IBM Plex Sans",sans-serif; color:var(--ink);}
  .week-header .week-count{font-size:12px; color:var(--ink-soft); font-family:"IBM Plex Mono",monospace;}
  .chrono-list{display:flex; flex-direction:column; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow);}
  .chrono-list .item-row:first-child{border-top:none;}
  .today-divider{
    display:flex; align-items:center; gap:10px; padding:9px 4px; margin:26px 0 8px; color:var(--prog);
    font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.09em;
  }
  .today-divider::before, .today-divider::after{content:""; flex:1; height:1px; background:var(--prog); opacity:.45;}
  .area-tag{font-size:10.5px; color:var(--accent); text-transform:uppercase; letter-spacing:.05em; font-weight:700; margin-bottom:3px;}
  .item-row.highlight-flash{animation:flashRow 1.7s ease;}
  @keyframes flashRow{0%{background:var(--gold-soft);}100%{background:transparent;}}
  .undated-note{font-size:13px; color:var(--ink-soft); padding:16px 18px;}

  /* ---------- Calendar view ---------- */
  .cal-month{margin-bottom:36px;}
  .cal-month-title{font-family:"Poppins",sans-serif; font-size:19px; font-weight:600; margin-bottom:10px;}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px;}
  .cal-dow{font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); font-weight:700; text-align:center; padding-bottom:4px;}
  .cal-cell{
    min-height:96px; background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:6px;
    display:flex; flex-direction:column; gap:4px;
  }
  .cal-cell.cal-empty{background:transparent; border:none;}
  .cal-cell.cal-today{border-color:var(--accent); border-width:2px;}
  .cal-daynum{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--ink-soft); font-weight:600;}
  .cal-today .cal-daynum{color:var(--accent);}
  .cal-chips{display:flex; flex-direction:column; gap:3px; overflow:hidden;}
  .cal-chip{
    all:unset; display:block; font-size:10px; line-height:1.3; padding:2px 5px; border-radius:4px;
    background:var(--prog-soft); color:var(--prog); cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    font-weight:500;
  }
  .cal-chip:hover{outline:1px solid var(--prog);}
  .cal-chip:focus-visible{outline:2px solid var(--prog);}
  .cal-chip-fp{background:transparent; border:1px dashed var(--line-strong); color:var(--ink-soft);}
  .cal-chip-done{background:var(--ok-soft); color:var(--ok); text-decoration:line-through;}
  .cal-chip-flag{background:var(--crit-soft); color:var(--crit); font-weight:700;}
  .cal-chip.dim{opacity:.2;}
  .cal-chip-extra{display:none;}
  .cal-cell.expanded .cal-chip-extra{display:block;}
  .cal-more{all:unset; display:block; font-size:9.5px; color:var(--prog); cursor:pointer; padding-left:2px; font-weight:600;}
  .cal-legend{display:flex; gap:18px; flex-wrap:wrap; margin-bottom:18px; font-size:12px; color:var(--ink-soft);}
  .cal-legend span{display:inline-flex; align-items:center; gap:6px;}
  .tl-swatch{width:12px; height:12px; border-radius:3px; display:inline-block;}
  @media (max-width:700px){.cal-cell{min-height:70px; padding:4px;} .cal-chip{font-size:9px;}}

  .sync-pill{ display:none; margin:14px auto 0; width:fit-content; max-width:100%; font-size:12px; font-weight:500; color:#D9D2EE; padding:5px 12px; border-radius:99px; background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.16); }

  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyTTTV9r8eGhH4xBrcfP0gMgwnLdOkqjt8kOl6IJbukF0rpa5iHiDfPZd0VXmyZ8of9/exec";
  const SHEET = "BCU";
  const LOCAL_KEY = "bcu-tracker-status-v1";
  function loadLocal(){ try{ const raw=localStorage.getItem(LOCAL_KEY); return raw? JSON.parse(raw) : null; }catch(e){ return null; } }
  function saveLocal(){ try{ const m={}; allItems().forEach(it=>{ m[it.id]={status:it.status,done:!!it.done}; }); localStorage.setItem(LOCAL_KEY, JSON.stringify({items:m, meta:DATA.meta})); }catch(e){} }
  function applyRows(rows){
    let latest = DATA.meta && DATA.meta.lastEdited ? DATA.meta.lastEdited : null;
    (rows||[]).forEach(r=>{
      const it = findItem(String(r.id||'')); if(!it) return;
      if(r.status && STATUS_VALUES.includes(r.status)){ it.status = r.status; it.done = (r.status==='Complete'); }
      if(r.updatedAt && (!latest || String(r.updatedAt) > latest)) latest = String(r.updatedAt);
    });
    DATA.meta = DATA.meta || {}; if(latest) DATA.meta.lastEdited = latest;
  }
  function setSync(text, kind){
    const el = document.getElementById('sync-pill'); if(!el) return;
    el.textContent = text || ''; el.className = 'sync-pill' + (kind? ' '+kind : '') + (text? ' show' : '');
  }

  function esc(s){
    return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function statusClass(st){
    if(!st) return 'status-Other';
    if(st==='Complete') return 'status-Complete';
    if(st==='In Progress') return 'status-InProgress';
    if(st==='Not Started') return 'status-NotStarted';
    return 'status-Other';
  }
  function allItems(){
    const out=[];
    DATA.sections.forEach(s => s.items.forEach(it => out.push(it)));
    return out;
  }
  function findItem(id){
    for(const s of DATA.sections){ for(const it of s.items){ if(it.id===id) return it; } }
    return null;
  }
  function counts(items){
    const total = items.length;
    const done = items.filter(i=>i.done).length;
    return {total, done, pct: total? Math.round(done/total*100):0};
  }

  function findSectionFor(id){
    for(const s of DATA.sections){ if(s.items.some(i=>i.id===id)) return s; }
    return null;
  }

  function parseDate(str){
    if(!str) return null;
    const m = /^(\d{1,2})\/(\d{1,2})$/.exec(String(str).trim());
    if(!m) return null;
    const mo = parseInt(m[1],10), da = parseInt(m[2],10);
    if(mo<1||mo>12||da<1||da>31) return null;
    return new Date(2026, mo-1, da);
  }
  function itemDueInfo(it){
    if(it.fd === 'Mid-Sept 2026') return {date:new Date(2026,8,15), approx:true};
    let d = parseDate(it.fd);
    if(d) return {date:d, approx:false};
    d = parseDate(it.fp);
    if(d) return {date:d, approx:false};
    return {date:null, approx:false};
  }
  function sortByFinalDue(a, b){
    const da = itemDueInfo(a).date, db = itemDueInfo(b).date;
    if(!da && !db) return 0;
    if(!da) return 1;
    if(!db) return -1;
    return da - db;
  }
  const _now = new Date(); const TODAY = new Date(_now.getFullYear(), _now.getMonth(), _now.getDate());
  function riskLabel(diffDays){
    if(diffDays < 0) return Math.abs(diffDays)+(Math.abs(diffDays)===1?' day overdue':' days overdue');
    if(diffDays === 0) return 'Due today';
    if(diffDays === 1) return 'Due tomorrow';
    return 'Due in '+diffDays+' days';
  }
  function riskInfo(it){
    if(it.done) return null;
    const due = itemDueInfo(it);
    if(!due || !due.date) return null;
    const diffDays = Math.round((due.date - TODAY) / 86400000);
    if(diffDays < 0) return {sev:'critical', label:riskLabel(diffDays), days:diffDays, date:due.date};
    if(diffDays <= 3) return {sev:'high', label:riskLabel(diffDays), days:diffDays, date:due.date};
    if(diffDays <= 14) return {sev:'medium', label:riskLabel(diffDays), days:diffDays, date:due.date};
    return null;
  }
  function computeTimelineRisks(){
    return allItems()
      .map(it=>({it, risk:riskInfo(it)}))
      .filter(x=>x.risk && x.risk.days <= 5)
      .sort((a,b)=>a.risk.days-b.risk.days);
  }
  let currentView = 'chrono';
  let currentFilter = 'all';
  let currentSearch = '';
  let openSections = new Set(DATA.sections.map(s=>s.key).concat(workflowGroups().map(w=>w.key)));

  function captureOpenSections(){
    document.querySelectorAll('details.section').forEach(d=>{
      const k = d.getAttribute('data-key');
      if(d.open) openSections.add(k); else openSections.delete(k);
    });
  }
  function rerender(){
    captureOpenSections();
    const scrollY = window.scrollY;
    render();
    try{ window.scrollTo(0, scrollY); }catch(e){}
  }

  function renderItemRow(it, opts){
    opts = opts || {};
    const risk = riskInfo(it);
    const areaInfo = opts.showArea ? findSectionFor(it.id) : null;
    const artistsHtml = (it.artists && it.artists.length)
      ? '<ul class="artist-list">' + it.artists.map(a=>'<li>'+esc(a)+'</li>').join('') + '</ul>'
      : '';
    const statusModClass = it.status==='Complete' ? 'st-complete' : (it.status==='In Progress' ? 'st-inprogress' : 'st-notstarted');
    const statusSelect =
      '<select class="status-select '+statusModClass+'" data-id="'+it.id+'" aria-label="Status for '+esc(it.name)+'">'
        + STATUS_VALUES.map(s=>'<option value="'+esc(s)+'"'+(s===it.status?' selected':'')+'>'+esc(s)+'</option>').join('')
      + '</select>';
    return (
      '<div id="item-'+it.id+'" class="item-row'+(it.done?' is-done':'')+'" data-id="'+it.id+'" data-status="'+esc(it.status)+'" data-flag="'+(risk?'1':'0')+'" data-search="'+esc((it.name+' '+it.owner+' '+it.notes).toLowerCase())+'">'
      + '<div class="col-main">'
        + (areaInfo? '<div class="area-tag">'+esc(partLabel(areaInfo.part))+' \u00b7 '+esc(areaInfo.title)+'</div>' : '')
        + '<div class="item-name">'+esc(it.name)+'</div>'
        + artistsHtml
        + (it.notes? '<div class="item-notes">'+esc(it.notes)+'</div>' : '')
      + '</div>'
      + '<div class="col-owner"><span class="lbl">Owner</span>'+esc(it.owner)+'</div>'
      + '<div class="col-fp"><span class="lbl">First Pass Due</span><span class="due-val">'+esc(it.fp)+'</span></div>'
      + '<div class="col-fd"><span class="lbl">Final Delivery Date</span><span class="due-val">'+esc(it.fd)+'</span></div>'
      + '<div class="col-dims"><span class="lbl">Dimensions</span>'+(it.specs? esc(it.specs) : '<span class="dim-empty">N/A</span>')+'</div>'
      + '<div class="col-status">'+statusSelect+(risk?'<div style="margin-top:6px;"><span class="risk-pill sev-'+risk.sev+'">'+esc(risk.label)+'</span></div>':'')+'</div>'
      + '</div>'
    );
  }

  function renderSection(sec){
    const c = counts(sec.items);
    const flagCount = sec.items.filter(i=>i.flag).length;
    return (
      '<details class="section" data-key="'+sec.key+'"'+(openSections.has(sec.key)?' open':'')+'>'
      + '<summary>'
        + '<svg class="sum-caret" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>'
        + '<div class="sum-title"><span class="part-tag">'+esc(partLabel(sec.part))+'</span>'+esc(sec.title)+(sec.location? '<span class="location-tag">'+esc(sec.location)+'</span>' : '')+'</div>'
        + (flagCount? '<span class="sum-flagcount">'+flagCount+' flagged</span>' : '')
        + '<div class="sum-progress"><div class="sum-track"><div class="sum-fill" style="width:'+c.pct+'%"></div></div><span class="sum-count">'+c.done+'/'+c.total+'</span></div>'
      + '</summary>'
      + '<div class="item-list">' + sec.items.slice().sort(sortByFinalDue).map(renderItemRow).join('') + '</div>'
      + '</details>'
    );
  }

  function workflowGroups(){
    const items = allItems();
    const byWf = {};
    items.forEach(it=>{
      let wf = WORKFLOW_MAP[it.id] || 'Other';
      if(!Array.isArray(wf)) wf = [wf];
      wf.forEach(w => { (byWf[w] = byWf[w] || []).push(it); });
    });
    const order = WORKFLOW_ORDER.concat(Object.keys(byWf).filter(k=>WORKFLOW_ORDER.indexOf(k)===-1));
    return order.filter(k=>byWf[k] && byWf[k].length).map(k=>({key:'wf-'+k.toLowerCase().replace(/[^a-z0-9]+/g,'-'), title:k, items:byWf[k]}));
  }

  function renderWorkflowSection(wf){
    const c = counts(wf.items);
    const flagCount = wf.items.filter(i=>i.flag).length;
    const teamTag = EVENTS_WORKFLOWS.indexOf(wf.title)!==-1 ? 'Events' : 'Creative';
    const loc = WORKFLOW_LOCATIONS[wf.title];
    return (
      '<details class="section" data-key="'+wf.key+'"'+(openSections.has(wf.key)?' open':'')+'>'
      + '<summary>'
        + '<svg class="sum-caret" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>'
        + '<div class="sum-title"><span class="part-tag">'+esc(teamTag)+'</span>'+esc(wf.title)+(loc? '<span class="location-tag">'+esc(loc)+'</span>' : '')+'</div>'
        + (flagCount? '<span class="sum-flagcount">'+flagCount+' flagged</span>' : '')
        + '<div class="sum-progress"><div class="sum-track"><div class="sum-fill" style="width:'+c.pct+'%"></div></div><span class="sum-count">'+c.done+'/'+c.total+'</span></div>'
      + '</summary>'
      + '<div class="item-list">' + wf.items.slice().sort(sortByFinalDue).map(it=>renderItemRow(it,{showArea:true})).join('') + '</div>'
      + '</details>'
    );
  }

  function renderRiskFlags(risks){
    if(!risks.length){
      return '<div class="empty-state">Nothing is overdue or due in the next 5 days.</div>';
    }
    const cards = risks.map(({it,risk})=>{
      const areaInfo = findSectionFor(it.id);
      const dueLabel = it.fd!=='TBD' ? it.fd : (it.fp!=='TBD' ? it.fp+' (first pass)' : '');
      return (
        '<button type="button" class="flag-card sev-'+risk.sev+'" data-jump="'+it.id+'">'
        + '<span class="flag-sev">'+esc(risk.label)+'</span>'
        + '<div class="flag-body">'
          + '<h3>'+esc(it.name)+'</h3>'
          + '<p>'+(areaInfo? esc(areaInfo.title)+' \u00b7 ' : '')+'Owner: '+esc(it.owner)+' \u00b7 Due '+esc(dueLabel)+' \u00b7 '+esc(it.status)+'</p>'
        + '</div>'
        + '</button>'
      );
    }).join('');
    return '<div class="flags-grid">' + cards + '</div>';
  }

  function weekMonday(d){
    const dt = new Date(d);
    const day = dt.getDay();
    const diff = (day===0? -6 : 1-day);
    dt.setDate(dt.getDate()+diff);
    dt.setHours(0,0,0,0);
    return dt;
  }
  function weekKey(d){ const m = weekMonday(d); return m.getFullYear()+'-'+m.getMonth()+'-'+m.getDate(); }
  function weekLabel(d){ return 'Week of ' + weekMonday(d).toLocaleDateString('en-US',{month:'short',day:'numeric'}); }

  function renderChronoView(){
    const items = allItems().map(it => { const o = Object.assign({}, it); o._due = itemDueInfo(it); return o; });
    const dated = items.filter(i=>i._due.date).sort((a,b)=>a._due.date-b._due.date);
    const undated = items.filter(i=>!i._due.date);

    let html = '';
    let currentWeek = null;
    let todayInserted = false;
    let buffer = [];

    function flush(){
      if(buffer.length){
        html += '<div class="week-header"><h3>'+esc(weekLabel(buffer[0]._due.date))+'</h3><span class="week-count">'+buffer.length+' item'+(buffer.length===1?'':'s')+'</span></div>';
        html += '<div class="chrono-list">' + buffer.map(it=>renderItemRow(it,{showArea:true, dueInfo:it._due})).join('') + '</div>';
        buffer = [];
      }
    }

    dated.forEach(it=>{
      if(!todayInserted && it._due.date >= TODAY){
        flush();
        html += '<div class="today-divider">Today · Sep 8, 2026</div>';
        todayInserted = true;
        currentWeek = null;
      }
      const wk = weekKey(it._due.date);
      if(wk !== currentWeek){ flush(); currentWeek = wk; }
      buffer.push(it);
    });
    flush();
    if(!todayInserted) html += '<div class="today-divider">Today · Sep 8, 2026</div>';

    if(undated.length){
      html += '<div class="section-title" style="margin-top:44px;"><h2 style="font-size:19px;">Undated / TBD</h2><span class="count">'+undated.length+' items waiting on a date</span></div>';
      html += '<div class="chrono-list">' + undated.map(it=>renderItemRow(it,{showArea:true, dueInfo:it._due})).join('') + '</div>';
    }
    return html;
  }

  function renderCalendarView(){
    const items = allItems();
    function key(d){ return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate(); }
    const byDate = {};
    items.forEach(it=>{
      const fd = it.fd==='Mid-Sept 2026' ? new Date(2026,8,15) : parseDate(it.fd);
      const fp = parseDate(it.fp);
      if(fd){ (byDate[key(fd)] = byDate[key(fd)]||[]).push({it,kind:'final'}); }
      if(fp && (!fd || fp.getTime()!==fd.getTime())){ (byDate[key(fp)] = byDate[key(fp)]||[]).push({it,kind:'fp'}); }
    });

    const months = [{y:2026,m:8},{y:2026,m:9},{y:2026,m:10}];
    const todayKey = key(TODAY);

    const monthsHtml = months.map(({y,m})=>{
      const first = new Date(y,m,1);
      const daysInMonth = new Date(y,m+1,0).getDate();
      const startOffset = first.getDay();
      const monthLabel = first.toLocaleDateString('en-US',{month:'long',year:'numeric'});
      let cells = '';
      for(let i=0;i<startOffset;i++) cells += '<div class="cal-cell cal-empty"></div>';
      for(let d=1; d<=daysInMonth; d++){
        const dObj = new Date(y,m,d);
        const k = key(dObj);
        const dayItems = byDate[k]||[];
        const isToday = k===todayKey;
        const chipsHtml = dayItems.map(({it,kind},idx)=>{
          const cls = ['cal-chip'];
          const risk = riskInfo(it);
          if(kind==='fp') cls.push('cal-chip-fp');
          if(it.done) cls.push('cal-chip-done');
          if(risk) cls.push('cal-chip-flag');
          if(idx>=3) cls.push('cal-chip-extra');
          const label = (kind==='fp'?'FP: ':'') + it.name;
          return '<button type="button" class="'+cls.join(' ')+'" data-jump="'+it.id+'" data-status="'+esc(it.status)+'" data-flag="'+(risk?'1':'0')+'" data-done="'+(it.done?'1':'0')+'" data-search="'+esc((it.name+' '+it.owner+' '+it.notes).toLowerCase())+'" title="'+esc((kind==='fp'?'First pass: ':'Due: ')+it.name)+'">'+esc(label)+'</button>';
        }).join('');
        const overflow = dayItems.length - 3;
        cells += '<div class="cal-cell'+(isToday?' cal-today':'')+'">'
          + '<div class="cal-daynum">'+d+'</div>'
          + '<div class="cal-chips">' + chipsHtml + (overflow>0? '<button type="button" class="cal-more" data-count="'+overflow+'">+'+overflow+' more</button>' : '') + '</div>'
          + '</div>';
      }
      const trailing = (7-((startOffset+daysInMonth)%7))%7;
      for(let i=0;i<trailing;i++) cells += '<div class="cal-cell cal-empty"></div>';
      return '<div class="cal-month"><div class="cal-month-title">'+monthLabel+'</div><div class="cal-grid">'
        + ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>'<div class="cal-dow">'+d+'</div>').join('')
        + cells + '</div></div>';
    }).join('');

    return (
      '<div class="cal-legend">'
        + '<span><span class="tl-swatch" style="background:var(--prog-soft); border:1px solid var(--prog);"></span>Final delivery due</span>'
        + '<span><span class="tl-swatch" style="background:transparent; border:1px dashed var(--line-strong);"></span>First pass due</span>'
        + '<span><span class="tl-swatch" style="background:var(--crit-soft); border:1px solid var(--crit);"></span>Flagged item</span>'
        + '<span><span class="tl-swatch" style="background:var(--ok-soft); border:1px solid var(--ok);"></span>Complete</span>'
        + '<span><span class="tl-swatch" style="background:transparent; border:2px solid var(--accent);"></span>Today</span>'
      + '</div>'
      + monthsHtml
    );
  }

  function render(){
    const items = allItems();
    const c = counts(items);
    const risks = computeTimelineRisks();

    const html =
      '<header class="top"><div class="wrap">'
        + '<img class="header-logo" src="'+LOGO_INVERT+'" alt="Disney Consumer Products Creative">'
        + '<div class="eyebrow"><span class="dot"></span>Global Creative</div>'
        + '<h1>Brand Commercialization Updates<br/><span class="grad-text">Creative Deliverables Tracker</span></h1>'
        + '<p class="event-meta">November 18\u201319, 2026<span class="sep">\u00b7</span>Orlando, FL</p>'
        + '<a class="box-link" href="https://disney.box.com/s/jnqis2b51iyd1h5vl41ch404wbrkeugw" target="_blank" rel="noopener noreferrer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg>View Project Box Folder</a>'
        + '<div id="sync-pill" class="sync-pill"></div>'
      + '</div></header>'

      + '<div class="controlbar"><div class="controlbar-inner">'

          + '<button class="view-tab'+(currentView==='calendar'?' active':'')+'" data-view="calendar">Calendar</button>'
          + '<button class="view-tab'+(currentView==='team'?' active':'')+'" data-view="team">By Team</button>'
          + '<button class="view-tab'+(currentView==='workflow'?' active':'')+'" data-view="workflow">By Workflow</button>'
        + '</div>'
        + '<div class="progress-ring-wrap"><div class="progress-track"><div class="progress-fill" style="width:'+c.pct+'%"></div></div>'
          + '<span class="progress-num">'+c.pct+'%<small> \u00b7 '+c.done+'/'+c.total+'</small></span></div>'
        + '<div class="search-box"><svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>'
          + '<input id="search-input" type="text" value="'+esc(currentSearch)+'" placeholder="Search deliverables, owners, notes\u2026"></div>'
        + '<div class="chip-row" id="filter-chips">'
          + '<button class="chip'+(currentFilter==='all'?' active':'')+'" data-filter="all">All</button>'
          + '<button class="chip'+(currentFilter==='open'?' active':'')+'" data-filter="open">Open</button>'

          + '<button class="chip flagged'+(currentFilter==='flag'?' active':'')+'" data-filter="flag">Flagged</button>'
        + '</div>'
        + '<div class="expand-btns" id="expand-btns" style="display:'+((currentView==='team'||currentView==='workflow')?'':'none')+';"><button class="ghost-btn" id="expand-all">Expand all</button><button class="ghost-btn" id="collapse-all">Collapse all</button></div>'
      + '</div></div>'

      + '<div class="wrap">'
        + '<div id="readonly-banner" class="readonly-banner">You have view-only access to this tracker; checklist changes here won\u2019t be saved for others.</div>'

        + '<div class="section-title"><h2>Timeline Risk Flags</h2><span class="count">'+risks.length+(risks.length===1?' item':' items')+'</span></div>'
        + '<p class="section-lede">Anything already overdue, or due in the next 5 days, and not yet checked off. Click a card to jump to it in the Chronological view.</p>'
        + renderRiskFlags(risks)

        + '<div class="view-panel active" data-view="chrono">'
          + '<div class="section-title"><h2>Chronological Timeline</h2><span class="count">'+c.total+' items, earliest to latest</span></div>'
          + '<p class="section-lede">Every deliverable from both trackers, ordered by the date it\u2019s actually due, grouped by week, with a marker for today so it\u2019s obvious what\u2019s already overdue.</p>'
          + renderChronoView()
        + '</div>'

        + '<div class="view-panel" data-view="calendar">'
          + '<div class="section-title"><h2>Calendar View</h2><span class="count">Sep \u2013 Nov 2026</span></div>'
          + '<p class="section-lede">Solid chips mark a final delivery date; dashed outlines mark a first-pass date. Click any chip to jump to it in the Chronological view.</p>'
          + renderCalendarView()
        + '</div>'

        + '<div class="view-panel" data-view="team">'
          + '<div class="section-title"><h2>Creative Team Deliverables</h2><span class="count">Source: BCU Creative Activation Deliverable Tracker</span></div>'
          + '<p class="section-lede">Owned deliverables from the Creative team\u2019s activation-by-activation tracker.</p>'
          + '<div id="part-a">' + DATA.sections.filter(s=>s.part==='A').map(renderSection).join('') + '</div>'

          + '<div class="section-title"><h2>Events Team Deliverables</h2><span class="count">Source: BCU 2026 Creative Grid</span></div>'
          + '<p class="section-lede">Print, digital, and signage deliverables from the Events team\u2019s grid, included here so both teams are checking off the same master list.</p>'
          + '<div id="part-b">' + DATA.sections.filter(s=>s.part==='B').map(renderSection).join('') + '</div>'
        + '</div>'

        + '<div class="view-panel" data-view="workflow">'
          + '<div class="section-title"><h2>By Workflow</h2><span class="count">'+c.total+' items across '+workflowGroups().length+' activations</span></div>'
          + '<p class="section-lede">Every deliverable grouped by the physical activation it belongs to, not by which team owns it, so a full activation (like Stickers or Lithograph) shows in one place across both the Creative and Events trackers.</p>'
          + '<div id="part-wf">' + workflowGroups().map(renderWorkflowSection).join('') + '</div>'
        + '</div>'

        + '<footer>'
          + '<span>Sources: BCU_Creative_Activation_Deliverable_Tracker (Creative), BCU 2026 Creative Grid (Events) \u00b7 synthesized '+new Date().toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})+'</span>'
          + '<span>Prepared for Marcus Rosie &amp; Bobby Kim by Jacci Hendershott</span>'
        + '</footer>'
      + '</div>';

    document.getElementById('app').innerHTML = html;
    applyFilters();
    updateEditPill();
    document.querySelectorAll('#view-tabs .view-tab').forEach(t=>t.classList.toggle('active', t.getAttribute('data-view')===currentView));
    document.querySelectorAll('.view-panel').forEach(p=>p.classList.toggle('active', p.getAttribute('data-view')===currentView));
    const eb = document.getElementById('expand-btns');
    if(eb) eb.style.display = (currentView==='team'||currentView==='workflow') ? '' : 'none';
  }

  function applyFilters(){
    document.querySelectorAll('.item-row').forEach(row=>{
      const isDone = row.classList.contains('is-done');
      const isFlagged = row.getAttribute('data-flag')==='1';
      const search = row.getAttribute('data-search')||'';
      let show = true;
      if(currentFilter==='open') show = !isDone;
      else if(currentFilter==='done') show = isDone;
      else if(currentFilter==='flag') show = isFlagged;
      if(show && currentSearch) show = search.indexOf(currentSearch)!==-1;
      row.classList.toggle('hidden-row', !show);
    });
    document.querySelectorAll('details.section').forEach(sec=>{
      const visible = sec.querySelectorAll('.item-row:not(.hidden-row)').length;
      sec.style.display = visible===0 ? 'none' : '';
    });
    document.querySelectorAll('.cal-chip').forEach(chip=>{
      const isDone = chip.getAttribute('data-done')==='1';
      const isFlagged = chip.getAttribute('data-flag')==='1';
      const search = chip.getAttribute('data-search')||'';
      let show = true;
      if(currentFilter==='open') show = !isDone;
      else if(currentFilter==='done') show = isDone;
      else if(currentFilter==='flag') show = isFlagged;
      if(show && currentSearch) show = search.indexOf(currentSearch)!==-1;
      chip.classList.toggle('dim', !show);
    });
  }

  function updateEditPill(){
    if(DATA.meta && DATA.meta.lastEdited){
      const d = new Date(DATA.meta.lastEdited);
      setSync('Last status update: '+d.toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}));
    }
  }

  async function saveItem(it){
    saveLocal();
    setSync('Saving\u2026');
    try{
      const res = await fetch(SCRIPT_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({ sheet:SHEET, id:it.id, fields:{ status:it.status, done: it.done? 'true':'false', name: it.name } }) });
      const out = await res.json();
      if(!res.ok || !out.ok) throw new Error(out.error || 'bad response');
      DATA.meta = DATA.meta || {}; DATA.meta.lastEdited = out.updatedAt || new Date().toISOString();
      saveLocal(); updateEditPill();
      setSync('Saved for everyone \u00b7 '+new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}), 'ok');
      setTimeout(()=>{ const el=document.getElementById('sync-pill'); if(el && el.classList.contains('ok')) updateEditPill(); }, 2500);
    }catch(e){
      setSync('Failed to save \u2014 check connection and change the status again', 'err');
    }
  }

  async function syncFromBackend(){
    setSync('Syncing latest changes\u2026');
    try{
      const res = await fetch(SCRIPT_URL + '?sheet=' + encodeURIComponent(SHEET));
      if(!res.ok) throw new Error('bad response');
      const rows = await res.json();
      applyRows(rows);
      saveLocal();
      rerender();
      updateEditPill();
    }catch(e){
      setSync('Could not reach the shared tracker \u2014 showing the last copy saved on this device', 'err');
    }
  }

  function jumpToItem(id){
    currentView = 'chrono';
    document.querySelectorAll('#view-tabs .view-tab').forEach(t=>t.classList.toggle('active', t.getAttribute('data-view')==='chrono'));
    document.querySelectorAll('.view-panel').forEach(p=>p.classList.toggle('active', p.getAttribute('data-view')==='chrono'));
    const eb = document.getElementById('expand-btns');
    if(eb) eb.style.display = 'none';
    requestAnimationFrame(()=>{
      const row = document.getElementById('item-'+id);
      if(row){
        row.classList.add('highlight-flash');
        setTimeout(()=>row.classList.remove('highlight-flash'), 1700);
        try{ row.scrollIntoView({behavior:'smooth', block:'center'}); }catch(e){}
      }
    });
  }

  function attachHandlers(){
    const app = document.getElementById('app');
    app.addEventListener('change', (e)=>{
      const sel = e.target.closest('.status-select');
      if(sel){
        const id = sel.getAttribute('data-id');
        const it = findItem(id);
        if(it){
          it.status = sel.value;
          it.done = (sel.value === 'Complete');
          rerender();
          saveItem(it);
        }
        return;
      }
    });
    app.addEventListener('click', (e)=>{
      const tab = e.target.closest('.view-tab');
      if(tab){
        currentView = tab.getAttribute('data-view');
        document.querySelectorAll('#view-tabs .view-tab').forEach(t=>t.classList.toggle('active', t===tab));
        document.querySelectorAll('.view-panel').forEach(p=>p.classList.toggle('active', p.getAttribute('data-view')===currentView));
        const eb = document.getElementById('expand-btns');
        if(eb) eb.style.display = (currentView==='team'||currentView==='workflow') ? '' : 'none';
        return;
      }
      const calChip = e.target.closest('.cal-chip');
      if(calChip){
        jumpToItem(calChip.getAttribute('data-jump'));
        return;
      }
      const flagJump = e.target.closest('.flag-card[data-jump]');
      if(flagJump){
        jumpToItem(flagJump.getAttribute('data-jump'));
        return;
      }
      const calMore = e.target.closest('.cal-more');
      if(calMore){
        const cell = calMore.closest('.cal-cell');
        cell.classList.toggle('expanded');
        calMore.textContent = cell.classList.contains('expanded') ? 'Show less' : ('+'+calMore.getAttribute('data-count')+' more');
        return;
      }
      const chip = e.target.closest('#filter-chips .chip');
      if(chip){
        document.querySelectorAll('#filter-chips .chip').forEach(c=>c.classList.remove('active'));
        chip.classList.add('active');
        currentFilter = chip.getAttribute('data-filter');
        applyFilters();
        return;
      }
      if(e.target.id==='expand-all'){
        document.querySelectorAll('.view-panel.active details.section').forEach(d=>{d.open=true;});
        captureOpenSections();
        return;
      }
      if(e.target.id==='collapse-all'){
        document.querySelectorAll('.view-panel.active details.section').forEach(d=>{d.open=false;});
        captureOpenSections();
        return;
      }
    });
    app.addEventListener('input', (e)=>{
      if(e.target.id==='search-input'){
        currentSearch = e.target.value.trim().toLowerCase();
        applyFilters();
      }
    });
  }

  // Paint immediately from the built-in data plus this device's last copy, then pull the shared state.
  (function(){ const local = loadLocal(); if(local && local.items){ allItems().forEach(it=>{ const l=local.items[it.id]; if(l && STATUS_VALUES.includes(l.status)){ it.status=l.status; it.done=(l.status==='Complete'); } }); if(local.meta && local.meta.lastEdited) DATA.meta.lastEdited = local.meta.lastEdited; } })();
  render();
  attachHandlers();
  syncFromBackend();
})();</script>
</body>
</html>
